<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#FBFBF8"/>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #181A1B; }
    .title { font-size: 48px; font-weight: 650; letter-spacing: -1.4px; }
    .subtitle { font-size: 23px; fill: #626866; }
    .label { font-size: 22px; font-weight: 560; }
    .value { font-size: 25px; font-weight: 680; }
    .axis { font-size: 18px; fill: #777D7A; }
    .note { font-size: 17px; fill: #777D7A; }
  </style>
  <text x="120" y="110" class="title">Most tasks require little user rescue</text>
  <text x="120" y="155" class="subtitle">Average non-approval interventions per successful run</text>
  <line x1="410" y1="230" x2="410" y2="730" stroke="#E4E5E1" stroke-width="1"/><text x="410" y="785" text-anchor="middle" class="axis">0.0</text><line x1="590" y1="230" x2="590" y2="730" stroke="#E4E5E1" stroke-width="1"/><text x="590" y="785" text-anchor="middle" class="axis">0.1</text><line x1="770" y1="230" x2="770" y2="730" stroke="#E4E5E1" stroke-width="1"/><text x="770" y="785" text-anchor="middle" class="axis">0.2</text><line x1="950" y1="230" x2="950" y2="730" stroke="#E4E5E1" stroke-width="1"/><text x="950" y="785" text-anchor="middle" class="axis">0.3</text><line x1="1130" y1="230" x2="1130" y2="730" stroke="#E4E5E1" stroke-width="1"/><text x="1130" y="785" text-anchor="middle" class="axis">0.4</text><line x1="1310" y1="230" x2="1310" y2="730" stroke="#E4E5E1" stroke-width="1"/><text x="1310" y="785" text-anchor="middle" class="axis">0.5</text><text x="375" y="288" text-anchor="end" class="label">Email</text><line x1="410" y1="280" x2="410" y2="280" stroke="#0D6B5E" stroke-width="8" opacity=".7"/><circle cx="410" cy="280" r="13" fill="#0D6B5E"/><text x="445" y="288" class="value">0.0</text><text x="375" y="408" text-anchor="end" class="label">Calendar</text><line x1="410" y1="400" x2="410" y2="400" stroke="#3F6FB6" stroke-width="8" opacity=".7"/><circle cx="410" cy="400" r="13" fill="#3F6FB6"/><text x="445" y="408" class="value">0.0</text><text x="375" y="528" text-anchor="end" class="label">Cross-tool</text><line x1="410" y1="520" x2="770" y2="520" stroke="#7955A3" stroke-width="8" opacity=".7"/><circle cx="770" cy="520" r="13" fill="#7955A3"/><text x="798" y="528" class="value">0.2</text><text x="375" y="648" text-anchor="end" class="label">Browser</text><line x1="410" y1="640" x2="770" y2="640" stroke="#C75B39" stroke-width="8" opacity=".7"/><circle cx="770" cy="640" r="13" fill="#C75B39"/><text x="798" y="648" class="value">0.2</text><text x="410" y="845" class="note">← Lower is better</text>
  <text x="120" y="948" class="note">Intentional send/calendar approvals are safety boundaries, not interventions.</text>
</svg>