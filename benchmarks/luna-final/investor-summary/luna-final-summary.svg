<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#FBFAF6"/><style>text{font-family:Inter,Arial,sans-serif;fill:#171717}.title{font-size:44px;font-weight:700;letter-spacing:-1.1px}.subtitle{font-size:22px;fill:#66635D}.axis{font-size:17px;fill:#66635D}.label{font-size:21px;font-weight:650}.value{font-size:25px;font-weight:700}.big{font-size:54px;font-weight:750}.note{font-size:16px;fill:#66635D}</style><text class="title" x="105" y="92">Same model. Reliability still depends on provider execution.</text><text class="subtitle" x="105" y="132">The final 60-run sample preserved safety but missed the production reliability gates</text><text class="label" x="815" y="215" text-anchor="middle">LUNA PRIMITIVE</text><text class="label" x="1265" y="215" text-anchor="middle">LUNA + SHOTCOUNT</text><text class="label" x="105" y="300">Live task success</text><text class="value" x="815" y="300" text-anchor="middle">90.0%</text><text class="value" x="1265" y="300" text-anchor="middle">86.7%</text><line x1="105" x2="1450" y1="334" y2="334" stroke="#DEDCD6"/><text class="label" x="105" y="402">Browser success</text><text class="value" x="815" y="402" text-anchor="middle">80.0%</text><text class="value" x="1265" y="402" text-anchor="middle">60.0%</text><line x1="105" x2="1450" y1="436" y2="436" stroke="#DEDCD6"/><text class="label" x="105" y="504">Cross-tool success</text><text class="value" x="815" y="504" text-anchor="middle">80.0%</text><text class="value" x="1265" y="504" text-anchor="middle">86.7%</text><line x1="105" x2="1450" y1="538" y2="538" stroke="#DEDCD6"/><text class="label" x="105" y="606">Execution precision</text><text class="value" x="815" y="606" text-anchor="middle">100.0%</text><text class="value" x="1265" y="606" text-anchor="middle">100.0%</text><line x1="105" x2="1450" y1="640" y2="640" stroke="#DEDCD6"/><text class="label" x="105" y="708">Distance-to-Done</text><text class="value" x="815" y="708" text-anchor="middle">4.80/5</text><text class="value" x="1265" y="708" text-anchor="middle">4.53/5</text><line x1="105" x2="1450" y1="742" y2="742" stroke="#DEDCD6"/><text class="label" x="105" y="810">Cost per success</text><text class="value" x="815" y="810" text-anchor="middle">$0.007738</text><text class="value" x="1265" y="810" text-anchor="middle">$0.008409</text><line x1="105" x2="1450" y1="844" y2="844" stroke="#DEDCD6"/><text class="axis" x="105" y="918">Decision: Luna + Harness is not sufficient as the sole default for current use cases.</text><text class="note" x="105" y="958">Six browser-provider timeouts, one stale-message read, and one cross-tool ordering failure account for all eight failures.</text></svg>
