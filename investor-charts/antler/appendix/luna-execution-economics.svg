<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FAF8F3"/><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:52px;font-weight:750;letter-spacing:-1.5px}.subtitle{font-size:24px;fill:#69665F}.kicker{font-size:18px;font-weight:700;letter-spacing:2px}.label{font-size:23px;font-weight:680}.body{font-size:20px}.small{font-size:16px;fill:#69665F}.metric{font-size:48px;font-weight:760;letter-spacing:-1px}.hero{font-size:72px;font-weight:780;letter-spacing:-2px}</style><text class="title" x="110" y="105">Sub-cent model economics for real-world execution</text><text class="subtitle" x="110" y="150">Broader model capability and current production-path unit cost are shown separately</text><text class="kicker" x="110" y="270">BROADER 60-RUN BENCHMARK</text><text class="hero" x="110" y="390">90.0%</text><text class="label" x="110" y="435">primitive live-task success</text><text class="metric" x="110" y="555">100%</text><text class="body" x="110" y="590">execution precision</text><text class="metric" x="110" y="710">4.80/5</text><text class="body" x="110" y="745">Distance-to-Done</text><text class="metric" x="110" y="865">$0.007738</text><text class="body" x="110" y="900">cost per successful task</text><line x1="820" x2="820" y1="245" y2="905" stroke="#D8D4CB"/><rect x="930" y="245" width="850" height="660" rx="16" fill="#6E56D9"/><text class="kicker" x="1000" y="315" fill="white">CURRENT PRODUCTION-PATH UNIT COST</text><text class="hero" x="1000" y="500" fill="white">$0.008409</text><text class="label" x="1000" y="550" fill="white">per successful task</text><text class="body" x="1000" y="650" fill="white">Conservative measured reference used</text><text class="body" x="1000" y="690" fill="white">for all investor unit economics</text><line x1="1000" x2="1670" y1="760" y2="760" stroke="white" opacity=".35"/><text class="body" x="1000" y="820" fill="white">Sub-cent model inference</text><text class="small" x="110" y="1034">The 3/3 targeted acceptance is not presented as a success-rate estimate and is not directly compared to the 60-run benchmark.</text></svg>
