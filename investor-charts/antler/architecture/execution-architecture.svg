<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FAF8F3"/><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:52px;font-weight:750;letter-spacing:-1.5px}.subtitle{font-size:24px;fill:#69665F}.kicker{font-size:18px;font-weight:700;letter-spacing:2px}.label{font-size:23px;font-weight:680}.body{font-size:20px}.small{font-size:16px;fill:#69665F}.metric{font-size:48px;font-weight:760;letter-spacing:-1px}.hero{font-size:72px;font-weight:780;letter-spacing:-2px}</style><text class="title" x="110" y="105">Cheap intelligence. Deterministic reliability.</text><text class="subtitle" x="110" y="150">Frontier reasoning only when necessary · targeted acceptance evidence</text><rect x="110" y="225" width="1040" height="250" rx="12" fill="#EEEAE2"/><text class="kicker" x="160" y="280">LUNA</text><text class="metric" x="160" y="355">Default intelligence</text><text class="body" x="160" y="405" fill="#69665F">Low-cost planning, tool choice and task execution</text><rect x="110" y="495" width="1040" height="330" rx="12" fill="#6E56D9"/><text class="kicker" x="160" y="550" fill="white">SHOTCOUNT RELIABILITY LAYER</text><text class="label" x="160" y="620" fill="white">Browser recovery</text><text class="label" x="520" y="620" fill="white">Provider reconciliation</text><text class="label" x="160" y="690" fill="white">State + ordering</text><text class="label" x="520" y="690" fill="white">Deterministic verification</text><text class="label" x="160" y="760" fill="white">Idempotency + completion evidence</text><rect x="110" y="845" width="1040" height="110" rx="12" fill="#121212"/><text class="kicker" x="160" y="890" fill="white">SOL</text><text class="label" x="160" y="930" fill="white">Verified reasoning fallback only</text><text class="metric" x="1270" y="280">3/3</text><text class="body" x="1450" y="280">known failure classes resolved</text><line x1="1270" x2="1810" y1="315" y2="315" stroke="#D8D4CB"/><text class="metric" x="1270" y="425">100%</text><text class="body" x="1450" y="425">execution precision</text><line x1="1270" x2="1810" y1="460" y2="460" stroke="#D8D4CB"/><text class="metric" x="1270" y="570">0</text><text class="body" x="1450" y="570">manual rescues</text><line x1="1270" x2="1810" y1="605" y2="605" stroke="#D8D4CB"/><text class="metric" x="1270" y="715">0</text><text class="body" x="1450" y="715">duplicate / unintended actions</text><line x1="1270" x2="1810" y1="750" y2="750" stroke="#D8D4CB"/><text class="metric" x="1270" y="860">0</text><text class="body" x="1450" y="860">infrastructure failures sent to Sol</text><line x1="1270" x2="1810" y1="895" y2="895" stroke="#D8D4CB"/><text class="small" x="110" y="1034">The Sol fallback was deliberately exercised once to verify plumbing; this does not measure production escalation frequency.</text></svg>
