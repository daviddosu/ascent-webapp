<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FAF8F3"/><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:52px;font-weight:750;letter-spacing:-1.5px}.subtitle{font-size:24px;fill:#69665F}.kicker{font-size:18px;font-weight:700;letter-spacing:2px}.label{font-size:23px;font-weight:680}.body{font-size:20px}.small{font-size:16px;fill:#69665F}.metric{font-size:48px;font-weight:760;letter-spacing:-1px}.hero{font-size:72px;font-weight:780;letter-spacing:-2px}</style><text class="title" x="110" y="105">The to-do list becomes an execution interface</text><text class="subtitle" x="110" y="150">ShotCount connects intent, persistent tasks and provider-confirmed outcomes</text><rect x="100" y="400" width="210" height="185" rx="12" fill="#EEEAE2"/><text x="205" y="447" text-anchor="middle" fill="#121212" font-size="14" font-weight="700"><tspan x="205" dy="0">INTENT</tspan></text><text x="205" y="515" text-anchor="middle" fill="#69665F" font-size="17" font-weight="400"><tspan x="205" dy="0">“Win a</tspan><tspan x="205" dy="22">scholarship”</tspan></text><path d="M310 492 H332 M318 480 L332 492 L318 504" fill="none" stroke="#121212" stroke-width="2"/><rect x="350" y="400" width="210" height="185" rx="12" fill="#EEEAE2"/><text x="455" y="447" text-anchor="middle" fill="#121212" font-size="14" font-weight="700"><tspan x="455" dy="0">ASK ROON</tspan></text><text x="455" y="515" text-anchor="middle" fill="#69665F" font-size="17" font-weight="400"><tspan x="455" dy="0">Break outcome</tspan><tspan x="455" dy="22">into tasks</tspan></text><path d="M560 492 H582 M568 480 L582 492 L568 504" fill="none" stroke="#121212" stroke-width="2"/><rect x="600" y="400" width="210" height="185" rx="12" fill="#EEEAE2"/><text x="705" y="447" text-anchor="middle" fill="#121212" font-size="14" font-weight="700"><tspan x="705" dy="0">TASK</tspan></text><text x="705" y="515" text-anchor="middle" fill="#69665F" font-size="17" font-weight="400"><tspan x="705" dy="0">Persistent</tspan><tspan x="705" dy="22">ShotCount object</tspan></text><path d="M810 492 H832 M818 480 L832 492 L818 504" fill="none" stroke="#121212" stroke-width="2"/><rect x="850" y="400" width="210" height="185" rx="12" fill="#EEEAE2"/><text x="955" y="447" text-anchor="middle" fill="#121212" font-size="14" font-weight="700"><tspan x="955" dy="0">DELEGATE</tspan></text><text x="955" y="515" text-anchor="middle" fill="#69665F" font-size="17" font-weight="400"><tspan x="955" dy="0">Luna executes</tspan></text><path d="M1060 492 H1082 M1068 480 L1082 492 L1068 504" fill="none" stroke="#121212" stroke-width="2"/><rect x="1100" y="400" width="210" height="185" rx="12" fill="#6E56D9"/><text x="1205" y="447" text-anchor="middle" fill="white" font-size="14" font-weight="700"><tspan x="1205" dy="0">SHOTCOUNT</tspan><tspan x="1205" dy="18">RELIABILITY</tspan></text><text x="1205" y="515" text-anchor="middle" fill="white" font-size="17" font-weight="400"><tspan x="1205" dy="0">Recover · verify</tspan><tspan x="1205" dy="22">· preserve</tspan></text><path d="M1310 492 H1332 M1318 480 L1332 492 L1318 504" fill="none" stroke="#121212" stroke-width="2"/><rect x="1350" y="400" width="210" height="185" rx="12" fill="#218A68"/><text x="1455" y="447" text-anchor="middle" fill="white" font-size="14" font-weight="700"><tspan x="1455" dy="0">REAL-WORLD</tspan><tspan x="1455" dy="18">OUTCOME</tspan></text><text x="1455" y="515" text-anchor="middle" fill="white" font-size="17" font-weight="400"><tspan x="1455" dy="0">Email · meeting</tspan><tspan x="1455" dy="22">· flight</tspan></text><path d="M1560 492 H1582 M1568 480 L1582 492 L1568 504" fill="none" stroke="#121212" stroke-width="2"/><rect x="1600" y="400" width="210" height="185" rx="12" fill="#EEEAE2"/><text x="1705" y="447" text-anchor="middle" fill="#121212" font-size="14" font-weight="700"><tspan x="1705" dy="0">SOCIAL</tspan><tspan x="1705" dy="18">ACCOUNTABILITY</tspan></text><text x="1705" y="515" text-anchor="middle" fill="#69665F" font-size="17" font-weight="400"><tspan x="1705" dy="0">Progress becomes</tspan><tspan x="1705" dy="22">visible</tspan></text><path d="M1755 620 C1755 820 215 820 215 620" fill="none" stroke="#E34A78" stroke-width="4"/><path d="M205 636 L215 616 L225 636" fill="none" stroke="#E34A78" stroke-width="4"/><text class="label" x="985" y="870" text-anchor="middle">Visible progress creates the next execution cycle</text><text class="small" x="110" y="1034">Product flow is conceptual; no quantitative frequency is implied.</text></svg>
