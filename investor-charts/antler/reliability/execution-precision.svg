<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FAF8F3"/><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:52px;font-weight:750;letter-spacing:-1.5px}.subtitle{font-size:24px;fill:#69665F}.kicker{font-size:18px;font-weight:700;letter-spacing:2px}.label{font-size:23px;font-weight:680}.body{font-size:20px}.small{font-size:16px;fill:#69665F}.metric{font-size:48px;font-weight:760;letter-spacing:-1px}.hero{font-size:72px;font-weight:780;letter-spacing:-2px}</style><text class="title" x="110" y="105">Measured execution precision</text><text class="subtitle" x="110" y="150">When ShotCount acts, provider-visible effects remain intended and exactly once</text><circle cx="535" cy="550" r="235" fill="none" stroke="#D8D4CB" stroke-width="28"/><circle cx="535" cy="550" r="235" fill="none" stroke="#218A68" stroke-width="28" stroke-dasharray="1476 1476" transform="rotate(-90 535 550)"/><text class="hero" x="535" y="545" text-anchor="middle">100%</text><text class="label" x="535" y="590" text-anchor="middle">execution precision</text><text class="metric" x="1000" y="400">0</text><text class="label" x="1155" y="400">duplicate / unintended actions</text><line x1="1000" x2="1770" y1="440" y2="440" stroke="#D8D4CB"/><text class="metric" x="1000" y="550">0</text><text class="label" x="1155" y="550">manual rescues</text><line x1="1000" x2="1770" y1="590" y2="590" stroke="#D8D4CB"/><text class="metric" x="1000" y="700">3/3</text><text class="label" x="1155" y="700">targeted known-failure acceptance</text><line x1="1000" x2="1770" y1="740" y2="740" stroke="#D8D4CB"/><text class="small" x="110" y="1034">100% execution precision across measured benchmark and targeted acceptance runs; this is not a claim of universal task reliability.</text></svg>
