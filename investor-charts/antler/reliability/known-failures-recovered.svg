<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FAF8F3"/><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:52px;font-weight:750;letter-spacing:-1.5px}.subtitle{font-size:24px;fill:#69665F}.kicker{font-size:18px;font-weight:700;letter-spacing:2px}.label{font-size:23px;font-weight:680}.body{font-size:20px}.small{font-size:16px;fill:#69665F}.metric{font-size:48px;font-weight:760;letter-spacing:-1px}.hero{font-size:72px;font-weight:780;letter-spacing:-2px}</style><text class="title" x="110" y="105">ShotCount turns known agent failure modes into recoverable states</text><text class="subtitle" x="110" y="150">Three exact failures · three targeted production-path acceptances</text><text class="label" x="110" y="300">Browser / provider timeout</text><line x1="550" x2="730" y1="292" y2="292" stroke="#D8D4CB" stroke-width="3"/><path d="M720 282 L740 292 L720 302" fill="none" stroke="#D8D4CB" stroke-width="3"/><rect x="760" y="245" width="590" height="95" rx="8" fill="#EEEAE2"/><text class="body" x="800" y="303">Worker recycle + canonical search reconstruction</text><line x1="1380" x2="1480" y1="292" y2="292" stroke="#D8D4CB" stroke-width="3"/><path d="M1470 282 L1490 292 L1470 302" fill="none" stroke="#D8D4CB" stroke-width="3"/><rect x="1510" y="245" width="300" height="95" rx="8" fill="#218A68"/><text x="1660" y="302" text-anchor="middle" fill="white" font-size="15" font-weight="700" letter-spacing="1.2">PASS WITH LUNA</text><text class="label" x="110" y="535">Stale Gmail provider state</text><line x1="550" x2="730" y1="527" y2="527" stroke="#D8D4CB" stroke-width="3"/><path d="M720 517 L740 527 L720 537" fill="none" stroke="#D8D4CB" stroke-width="3"/><rect x="760" y="480" width="590" height="95" rx="8" fill="#EEEAE2"/><text class="body" x="800" y="538">Provider reread + canonical reconciliation</text><line x1="1380" x2="1480" y1="527" y2="527" stroke="#D8D4CB" stroke-width="3"/><path d="M1470 517 L1490 527 L1470 537" fill="none" stroke="#D8D4CB" stroke-width="3"/><rect x="1510" y="480" width="300" height="95" rx="8" fill="#218A68"/><text x="1660" y="537" text-anchor="middle" fill="white" font-size="15" font-weight="700" letter-spacing="1.2">PASS WITH LUNA</text><text class="label" x="110" y="770">Cross-tool ordering / reasoning boundary</text><line x1="550" x2="730" y1="762" y2="762" stroke="#D8D4CB" stroke-width="3"/><path d="M720 752 L740 762 L720 772" fill="none" stroke="#D8D4CB" stroke-width="3"/><rect x="760" y="715" width="590" height="95" rx="8" fill="#EEEAE2"/><text class="body" x="800" y="773">Ordered evidence + deterministic verifier</text><line x1="1380" x2="1480" y1="762" y2="762" stroke="#D8D4CB" stroke-width="3"/><path d="M1470 752 L1490 762 L1470 772" fill="none" stroke="#D8D4CB" stroke-width="3"/><rect x="1510" y="715" width="300" height="95" rx="8" fill="#121212"/><text x="1660" y="772" text-anchor="middle" fill="white" font-size="15" font-weight="700" letter-spacing="1.2">SOL VERIFIED REPAIR</text><text class="small" x="110" y="1034">The third scenario used test-only semantic substitution to exercise Sol fallback; no production escalation rate is inferred.</text></svg>
